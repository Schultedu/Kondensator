<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kondensator-Chroniken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1120;--panel:#161b2e;--panel2:#1e2540;--line:rgba(224,182,90,.22);
  --gold:#e0b65a;--gold2:#f7dc95;--text:#ece5d3;--muted:#9aa1b6;--ok:#5fd18b;--bad:#ff6f6f;
  --mw:46px;--mh:64px;--cw:168px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Alegreya Sans',system-ui,sans-serif;color:var(--text);font-size:17px;line-height:1.45;
  background:
    radial-gradient(1200px 600px at 50% -10%,#2b3a63 0%,transparent 60%),
    radial-gradient(800px 500px at 100% 100%,#2a1d3f 0%,transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
h1,h2,h3,.logo,.cname,.btn,.lvl,.tabs button{font-family:'Cinzel',serif}
h2{margin:.2em 0 .5em;color:var(--gold2);font-size:1.3rem}
h3{margin:.1em 0 .3em;color:var(--gold2)}
.muted{color:var(--muted)} .small{font-size:.88rem}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--text);background:#0c1020;border:1px solid var(--line);border-radius:10px;padding:.6em .8em;width:100%}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:.6em 1.1em;border-radius:10px;font-weight:600;letter-spacing:.02em;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.15)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.gold{background:linear-gradient(180deg,#f2cf7b,#c8963c);color:#2a1c05;border-color:#f7dc95}
.btn.ghost{background:transparent}
.btn.small{padding:.35em .75em;font-size:.82rem}
.btn.danger{background:#5a2328;border-color:#a84a4a}
.panel{background:linear-gradient(180deg,rgba(30,37,64,.92),rgba(20,25,44,.92));border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin-top:.4em}
.hidden{display:none!important}

/* ---------- Start ---------- */
.start{max-width:980px;margin:0 auto;padding:2.5rem 1rem 3rem}
.hero{text-align:center;margin-bottom:1.6rem}
.sigil{font-size:3.4rem;filter:drop-shadow(0 0 18px rgba(247,220,149,.6));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 30px rgba(247,220,149,.9));transform:scale(1.05)}}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);margin:.1em 0;background:linear-gradient(180deg,#fff2c9,#d9a649);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.04em}
.tag{color:var(--gold);margin:0;font-style:italic}
.story{max-width:680px;margin:1rem auto 0;color:#d6cfbd}
.startgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.startgrid form{display:flex;flex-direction:column;gap:.6rem}
.startgrid label{font-size:.9rem;color:var(--muted)}
.cont{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;justify-content:center;text-align:center}
@media(max-width:720px){.startgrid{grid-template-columns:1fr}}

/* ---------- Hub ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);background:rgba(10,13,26,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.logo{font-weight:800;color:var(--gold2);font-size:1.15rem;display:flex;gap:.4rem;align-items:center}
.chips{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.2em .7em;font-size:.9rem}
.save.dirty{animation:glow 1.6s ease-in-out infinite;border-color:var(--gold)}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(224,182,90,.25)}}
.tabs{display:flex;gap:.4rem;justify-content:center;padding:.9rem .6rem 0;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;color:var(--muted);padding:.55em 1.1em;border-radius:12px 12px 0 0;font-weight:600}
.tabs button.on{color:var(--gold2);border-color:var(--line);border-bottom-color:transparent;background:rgba(30,37,64,.8)}
main{max-width:1180px;margin:0 auto;padding:1rem}

/* ---------- Aufgaben ---------- */
.tgrid{display:grid;grid-template-columns:1fr 320px;gap:1rem;align-items:start}
@media(max-width:900px){.tgrid{grid-template-columns:1fr}}
.parchment{background:linear-gradient(180deg,#f3e6c4,#e6d3a6);color:#2d2312;border-color:#b8975a}
.parchment h2{color:#5a3d0f}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.lvl{border:2px solid #b8975a;background:#efe0b9;color:#5a3d0f;border-radius:12px;padding:.5em .3em;font-weight:800;display:flex;flex-direction:column;align-items:center}
.lvl small{font-family:'Alegreya Sans';font-weight:500;font-size:.72rem;color:#7a6234;margin-top:.15em}
.lvl.on{background:#5a3d0f;color:#f7dc95;border-color:#5a3d0f}
.lvl.on small{color:#e6cf9a}
.ttopic{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:#8a6a2c;font-weight:700}
.ttext{font-size:1.15rem;margin:.4rem 0 .6rem}
.tconst{font-size:.92rem;color:#6d5627;margin-bottom:.6rem}
.answer{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.8rem 0 .4rem}
.answer label{font-weight:700;font-size:1.15rem}
.answer input{flex:1;min-width:140px;max-width:240px;background:#fffaf0;color:#2d2312;border-color:#b8975a;font-size:1.1rem}
.answer .unit{font-weight:700;font-size:1.1rem;min-width:2.5em}
#hint{color:#5a3d0f;font-weight:600}
.fb{margin-top:.8rem;padding:.7rem .9rem;border-radius:10px;font-weight:700}
.fb.ok{background:#d5f3dc;color:#145c2b;border:1px solid #6fbf86}
.fb.bad{background:#fbdcdc;color:#7a1d1d;border:1px solid #d77d7d}
.sol{margin:.7rem 0;padding:.7rem .9rem;border-left:4px solid #b8975a;background:rgba(255,255,255,.45);border-radius:6px}
.side h3{font-size:1rem}
.streak{font-size:2.2rem;font-weight:800;color:var(--gold2);font-family:Cinzel}
.bar{height:10px;background:#0c1020;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c8963c,#f7dc95);border-radius:99px;transition:width .4s}
.bar i.ok{background:linear-gradient(90deg,#3aa76a,#7ee0a3)}
.odds{display:grid;grid-template-columns:auto 1fr auto;gap:.3rem .6rem;align-items:center;font-size:.88rem}
.odds .bar{height:8px}
.stat{display:flex;justify-content:space-between;font-size:.95rem;padding:.15rem 0}
details{margin-top:.8rem}
summary{cursor:pointer;color:var(--gold);font-weight:700}
.formulas{font-size:.95rem;line-height:1.7}
.sep{border:0;border-top:1px solid var(--line);margin:.9rem 0}

/* ---------- Karten ---------- */
.rG{--rc:#aab3bd}.rS{--rc:#4da3ff}.rE{--rc:#b774ff}.rL{--rc:#ffb238}
.rtag{display:inline-block;font-size:.75rem;font-weight:700;padding:.05em .55em;border-radius:99px;border:1px solid var(--rc);color:var(--rc)}
.card{position:relative;width:var(--cw);min-height:calc(var(--cw)*1.5);border-radius:14px;border:3px solid var(--rc);background:linear-gradient(180deg,#2b2440,#141225 70%);padding:.5rem .55rem .6rem;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 20px rgba(0,0,0,.4);color:var(--text)}
.card.rE{box-shadow:0 0 18px rgba(183,116,255,.35),0 6px 18px rgba(0,0,0,.45)}
.card.rL{box-shadow:0 0 24px rgba(255,178,56,.5),0 6px 18px rgba(0,0,0,.45);background:linear-gradient(180deg,#3d2c1c,#161224 70%)}
.cart{width:100%;aspect-ratio:1.25;border-radius:10px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 45%,transparent),transparent 70%),linear-gradient(180deg,#1b2140,#0f1226);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08)}
.cart span{font-size:calc(var(--cw)*.36);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.cp{position:absolute;top:-10px;left:-10px;width:36px;height:36px;border-radius:50%;background:#e9e3d2;color:#1a1a1a;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--rc);font-family:Cinzel;z-index:2;font-size:1.05rem}
.cp.hero{background:linear-gradient(180deg,#ffe8a3,#d39b32);border-color:#fff3c4}
.cp.spec{background:#2a2140;color:var(--gold2)}
.crow{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:#1a1f38;border:2px solid var(--rc);display:flex;align-items:center;justify-content:center;font-size:.85rem;z-index:2}
.cname{font-weight:800;font-size:.86rem;margin-top:.4rem;color:#fff3d6;line-height:1.15}
.ctype{font-size:.68rem;color:var(--rc);text-transform:uppercase;letter-spacing:.05em;margin:.15rem 0 .3rem}
.cab{font-size:.72rem;line-height:1.25;color:#d8d1c0}
.cfl{font-size:.68rem;font-style:italic;color:var(--muted);margin-top:auto;padding-top:.35rem}
.ccount{position:absolute;bottom:-9px;right:-9px;background:var(--gold);color:#2a1c05;font-weight:800;border-radius:99px;padding:0 .5em;font-size:.85rem;border:2px solid #fff3c4}
.cnew{position:absolute;top:22%;right:-12px;transform:rotate(12deg);background:#e2483d;color:#fff;font-weight:800;font-size:.8rem;padding:.1em .5em;border-radius:6px;font-family:Cinzel;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.card.unknown{filter:grayscale(1) brightness(.45);border-style:dashed}
.card.unknown .cart span{font-size:calc(var(--cw)*.3);color:#888;font-family:Cinzel}

.colhead{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;align-items:center;margin-bottom:1rem}
.colhead p{flex-basis:100%;margin:.2rem 0 0}
.filters{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto}
.filters button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:.2em .8em;font-size:.85rem}
.filters button.on{background:var(--gold);color:#2a1c05;border-color:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--cw) + 18px),1fr));gap:1.4rem .6rem;justify-items:center;padding:.6rem 0}
.cslot{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.dctl{display:flex;align-items:center;gap:.4rem;font-size:.85rem}
.dctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:800}
.dctl span{min-width:76px;text-align:center}
.dctl.in span{color:var(--ok);font-weight:700}
@media(max-width:560px){:root{--cw:142px}}

/* ---------- Bosse ---------- */
.bosses{display:flex;flex-direction:column;gap:.9rem}
.boss{display:grid;grid-template-columns:96px 1fr auto;gap:1rem;align-items:center}
.bport{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;background:radial-gradient(circle,#4a2a3a,#140f1f);border:3px solid #a8463f;box-shadow:0 0 20px rgba(168,70,63,.4)}
.boss.done .bport{border-color:var(--ok);box-shadow:0 0 18px rgba(95,209,139,.35)}
.boss.locked{opacity:.55}
.boss.locked .bport{border-color:#555;box-shadow:none;background:#111}
.bort{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.binfo p{margin:.2rem 0}
.bpass{color:#f0b3a8;font-size:.92rem}
.bmeter{margin:.5rem 0 .3rem;max-width:420px}
.bmlab{font-size:.82rem;color:var(--muted);margin-bottom:.2rem}
.brew{font-size:.88rem}
.bact{display:flex;flex-direction:column;gap:.4rem;align-items:flex-end;text-align:right}
.badge{color:var(--ok);font-weight:700}
@media(max-width:700px){.boss{grid-template-columns:64px 1fr}.bport{width:64px;height:64px;font-size:2rem}.bact{grid-column:1/-1;align-items:stretch;text-align:left}}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(5,7,15,.78);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(3px)}
.mbox{background:linear-gradient(180deg,#232b4a,#161b2e);border:1px solid var(--gold);border-radius:18px;padding:1.4rem;max-width:760px;width:100%;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox.left{text-align:left}
.reveal{display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:center;margin:1.2rem 0 1.4rem;perspective:1000px}
.flip{width:var(--cw)}
.fin{position:relative;display:grid;transition:transform .8s cubic-bezier(.3,1.4,.5,1);transition-delay:var(--d);transform-style:preserve-3d}
.flip.open .fin{transform:rotateY(180deg)}
.fback,.ffront{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ffront{transform:rotateY(180deg)}
.fback{border-radius:14px;border:3px solid var(--gold);background:repeating-linear-gradient(45deg,#2a2140 0 10px,#211a35 10px 20px);display:flex;align-items:center;justify-content:center;font-size:3rem}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;min-height:120px;word-break:break-all;margin:.6rem 0}
.row2{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.rules{text-align:left;font-size:.95rem}
.rules li{margin:.25rem 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a3254;border:1px solid var(--gold);padding:.6rem 1.1rem;border-radius:12px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- Kampf ---------- */
.battle{max-width:960px;margin:0 auto;padding:.6rem .6rem 1.2rem;display:flex;flex-direction:column;gap:.45rem;position:relative}
.bbar{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.pinfo{display:flex;align-items:center;gap:.7rem;background:rgba(20,25,44,.85);border:1px solid var(--line);border-radius:14px;padding:.45rem .7rem}
.pinfo.ai{border-color:rgba(168,70,63,.6)}
.pport{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:radial-gradient(circle,#4a2a3a,#140f1f);border:2px solid #a8463f;flex:none}
.pinfo.pl .pport{background:radial-gradient(circle,#2a3a5a,#0f1426);border-color:var(--gold)}
.pname{font-family:Cinzel;font-weight:800;font-size:.95rem}
.gems{letter-spacing:.15em;font-size:.95rem}
.pstats{font-size:.82rem;color:var(--muted);margin-left:auto;text-align:right}
.ptotal{font-family:Cinzel;font-weight:800;font-size:1.6rem;min-width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0c1020;border:2px solid var(--line);flex:none}
.ptotal.lead{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 12px rgba(224,182,90,.4)}
.passtag{background:#5a2328;color:#ffd2d2;font-size:.75rem;padding:.1em .5em;border-radius:6px;font-weight:700}
.board{display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,rgba(60,40,30,.35),rgba(30,25,20,.35));border:1px solid var(--line);border-radius:14px;padding:6px}
.brow{display:grid;grid-template-columns:40px 28px 1fr 34px;align-items:center;min-height:calc(var(--mh) + 8px);background:rgba(255,255,255,.035);border-radius:9px;border:1px solid rgba(224,182,90,.12);position:relative;transition:background .2s}
.brow.ai{background:rgba(168,70,63,.07)}
.brow.wN{background:linear-gradient(90deg,rgba(140,200,255,.25),rgba(140,200,255,.08))}
.brow.wF{background:linear-gradient(90deg,rgba(190,190,200,.28),rgba(190,190,200,.08))}
.brow.wB{background:linear-gradient(90deg,rgba(70,110,200,.32),rgba(70,110,200,.1))}
.brow.target{outline:2px dashed var(--gold);cursor:pointer;background:rgba(224,182,90,.15)}
.rsum{font-family:Cinzel;font-weight:800;text-align:center;font-size:1.05rem;color:var(--gold2)}
.rhorn{text-align:center;font-size:1.1rem}
.rcards{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;padding:3px 0}
.rico{text-align:center;font-size:1rem;opacity:.75;line-height:1.1}
.wico{display:block;font-size:.9rem}
.mid{display:flex;justify-content:center;align-items:center;gap:.8rem;padding:2px 0;font-size:.85rem;color:var(--muted)}
.mid b{color:var(--gold2);font-family:Cinzel}
.mini{position:relative;width:var(--mw);height:var(--mh);border-radius:7px;border:2px solid var(--rc);background:linear-gradient(180deg,#2b2440,#141225);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .12s}
.mini:hover{transform:translateY(-2px)}
.mini.sel{outline:3px solid #fff;transform:translateY(-6px);box-shadow:0 0 14px rgba(255,255,255,.4)}
.me{font-size:calc(var(--mw)*.52)}
.mp{position:absolute;top:2px;left:2px;min-width:20px;height:20px;padding:0 3px;border-radius:99px;background:#e9e3d2;color:#111;font-weight:800;font-size:.72rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--rc);font-family:Cinzel}
.mp.hero{background:linear-gradient(180deg,#ffe8a3,#d39b32)}
.mp.up{background:#7ee0a3}.mp.down{background:#ff9a9a}
.mab{position:absolute;bottom:-2px;right:0;font-size:.6rem}
.mrow{position:absolute;bottom:-3px;left:1px;font-size:.6rem;opacity:.85}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:.5rem;background:rgba(10,13,26,.6);border:1px solid var(--line);border-radius:14px;min-height:calc(var(--hmh,80px) + 16px)}
.hand .mini{--mw:58px;--mh:80px}
.ibar{display:flex;align-items:center;gap:.7rem;background:rgba(20,25,44,.9);border:1px solid var(--line);border-radius:12px;padding:.45rem .7rem;min-height:56px}
.ibig{font-size:2rem}
.itxt{flex:1;font-size:.95rem}
.blog{font-size:.82rem;color:var(--muted);max-height:5.2em;overflow:hidden}
.blog div:first-child{color:var(--text)}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:linear-gradient(180deg,#2a3254,#151a2e);border:2px solid var(--gold);padding:1rem 1.6rem;border-radius:16px;font-family:Cinzel;font-weight:800;font-size:1.3rem;color:var(--gold2);z-index:30;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.7);animation:pop .35s;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}
@media(max-width:640px){
  :root{--mw:34px;--mh:48px}
  .hand .mini{--mw:46px;--mh:64px}
  .brow{grid-template-columns:30px 20px 1fr 24px}
  .pport{width:38px;height:38px;font-size:1.3rem}
  .ptotal{min-width:42px;height:42px;font-size:1.25rem}
  .mp{min-width:16px;height:16px;font-size:.62rem}
  .banner{font-size:1rem;white-space:normal;width:86%}
}

.cart{overflow:hidden}
.cart .art,.pport .art,.bport .art,.ibig .art{width:100%;height:100%;display:block;object-fit:cover}
.mini{overflow:hidden}
.mini .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mp,.mab,.mrow{z-index:2}
.mab,.mrow{background:rgba(0,0,0,.55);border-radius:4px;padding:0 1px}
.pport,.bport{overflow:hidden}
.ibig{width:64px;height:52px;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line)}
.card.unknown .cart span{display:block}

.prep{display:flex;flex-direction:column;gap:.8rem}
.prephead{display:grid;grid-template-columns:84px 1fr;gap:1rem;align-items:center}
.prephead .bport{width:84px;height:84px}
.prephead p{margin:.2rem 0}
.pselhead{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.pselcards{display:flex;flex-wrap:wrap;gap:6px;min-height:86px;align-items:center;padding:.4rem;background:rgba(10,13,26,.6);border-radius:12px;border:1px dashed var(--line)}
.pselcards .mini{--mw:58px;--mh:80px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:.7rem}
.ptile{background:linear-gradient(180deg,#2b2440,#141225);border:2px solid var(--rc);border-radius:12px;padding:.35rem;cursor:pointer;transition:transform .12s,opacity .15s;position:relative}
.ptile:hover{transform:translateY(-2px)}
.ptile.used{box-shadow:0 0 0 2px var(--gold)}
.ptile.dis{opacity:.4;cursor:not-allowed}
.part{position:relative;aspect-ratio:1.25;border-radius:8px;overflow:hidden}
.part .art{width:100%;height:100%;object-fit:cover;display:block}
.part .mp{top:3px;left:3px}
.prow{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);border-radius:6px;font-size:.75rem;padding:0 3px}
.pname{font-family:Cinzel;font-weight:800;font-size:.78rem;margin-top:.3rem;line-height:1.15}
.pab{font-size:.7rem;color:var(--muted);min-height:1em}
.pcount{font-size:.72rem;color:var(--gold2);margin-top:.15rem}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.logo-hero{display:block;width:min(820px,100%);margin:0 auto -.4rem;border-radius:20px;-webkit-mask-image:radial-gradient(ellipse 52% 50% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 52% 50% at 50% 50%,#000 60%,transparent 100%);filter:drop-shadow(0 0 30px rgba(120,170,255,.25))}
.logo-sm{height:48px;display:block;border-radius:8px;border:1px solid var(--line)}
@media(max-width:560px){.logo-sm{height:38px}}

let artN=0;
function shade(h,a){let n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;const t=a<0?0:255,p=Math.abs(a);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function svgWrap(bg,body){
  const k='k'+(++artN);
  return `<svg class="art" viewBox="0 0 200 160" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>
<radialGradient id="b${k}" cx="50%" cy="36%" r="80%"><stop offset="0" stop-color="${shade(bg,.12)}"/><stop offset=".5" stop-color="${shade(bg,-.5)}"/><stop offset="1" stop-color="#04050a"/></radialGradient>
<filter id="g${k}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
<filter id="G${k}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
<linearGradient id="v${k}" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-opacity="0"/><stop offset="1" stop-opacity=".8"/></linearGradient>
<linearGradient id="l${k}" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".58" stop-opacity="0"/><stop offset="1" stop-opacity=".5"/></linearGradient>
</defs><rect width="200" height="160" fill="url(#b${k})"/>${body(k)}<rect width="200" height="160" fill="url(#v${k})"/></svg>`;
}
const gl=k=>`filter="url(#g${k})"`, GL=k=>`filter="url(#G${k})"`;
function lit(d,fill,k,extra=''){return `<path d="${d}" fill="${fill}" ${extra}/><path d="${d}" fill="url(#l${k})"/>`;}
function sparks(k,c,n,seed){let s='',x=seed*9301+49297;const r=()=>{x=(x*9301+49297)%233280;return x/233280;};
  for(let i=0;i<n;i++){const cx=(r()*200).toFixed(1),cy=(r()*130).toFixed(1),rr=(0.8+r()*2.2).toFixed(1);s+=`<circle cx="${cx}" cy="${cy}" r="${rr*1.8}" fill="${c}" opacity=".6" ${gl(k)}/><circle cx="${cx}" cy="${cy}" r="${rr*0.6}" fill="#fff"/>`;}return s;}

/* =========================================================
   SPIELSTAND & SPEICHERCODE
   ========================================================= */
let S=null, dirty=false, view='tasks', colFilter='all';
const SALT='voltaria·kondensator·2026';
function cyrb53(str,seed=7){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function makeCode(){
  const json=JSON.stringify({v:1,n:S.n,c:S.c,d:S.d,b:S.b,s:S.s});
  const b64=btoa(unescape(encodeURIComponent(json))).replace(/=+$/,'');
  return 'KC1.'+b64+'.'+cyrb53(b64+SALT).toString(36).slice(-6);
}
function readCode(code){
  code=String(code).replace(/\s+/g,'');
  const p=code.split('.');
  if(p.length!==3||p[0]!=='KC1') throw new Error('Das ist kein gültiger Speichercode (er beginnt mit „KC1.“).');
  if(cyrb53(p[1]+SALT).toString(36).slice(-6)!==p[2]) throw new Error('Der Code ist beschädigt oder wurde verändert. Bitte prüfe, ob du ihn vollständig kopiert hast.');
  let b=p[1]; while(b.length%4) b+='=';
  const d=JSON.parse(decodeURIComponent(escape(atob(b))));
  const st={n:String(d.n||'Held').slice(0,20),c:{},d:{},b:[],s:{ok:0,all:0,st:0,best:0,w:0,l:0}};
  for(const k in d.c||{}) if(CARD[k]&&!CARD[k].boss){const v=Math.max(0,Math.floor(d.c[k]));if(v)st.c[k]=v;}
  for(const k in d.d||{}) if(st.c[k]){const v=Math.min(st.c[k],Math.max(0,Math.floor(d.d[k])));if(v)st.d[k]=v;}
  st.b=(Array.isArray(d.b)?d.b:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<BOSSES.length);
  Object.assign(st.s,d.s||{});
  return st;
}
function persist(){dirty=true;try{localStorage.setItem('kc_save',makeCode());}catch(e){} const b=$('.save');if(b)b.classList.add('dirty');}
function chunk(s){return s.match(/.{1,40}/g).join('\n');}

const LVL={
  1:{n:'Leicht',odds:{G:70,S:25,E:4.5,L:0.5}},
  2:{n:'Mittel',odds:{G:50,S:35,E:12,L:3}},
  3:{n:'Schwer',odds:{G:30,S:40,E:23,L:7}}
};
function rollRarity(odds){let x=Math.random()*100;for(const r of RORD){x-=odds[r]||0;if(x<0)return r;}return 'G';}
function drawCard(odds,unitsOnly){const r=rollRarity(odds);const pool=POOL.filter(c=>c.r===r&&(!unitsOnly||c.t==='u'));return pick(pool).id;}
function addCard(id){S.c[id]=(S.c[id]||0)+1;}
function deckStrength(){ // Summe der 10 stärksten Einheiten der Sammlung
  const pw=[];for(const id in S.c){const c=CARD[id];if(c.t==='u')for(let i=0;i<S.c[id];i++)pw.push(c.p);}
  return pw.sort((a,b)=>b-a).slice(0,10).reduce((a,b)=>a+b,0);
}

function abilityText(c){
  if(c.t==='w') return c.w==='klar'?'☀️ Entfernt alle Wettereffekte vom Feld.':`${c.e} <b>Wetter:</b> Alle normalen Einheiten in der ${ROWS[c.w].n}reihe (auf beiden Seiten!) haben nur noch Stärke 1.`;
  if(c.t==='horn') return '📯 Verdoppelt die Stärke aller normalen Einheiten in einer deiner Reihen.';
  if(c.t==='blitz') return '🌩️ Vernichtet die stärkste(n) normale(n) Einheit(en) auf dem ganzen Feld – auch deine eigenen!';
  if(!c.ab.length) return '<span class="muted">Keine Fähigkeit</span>';
  return c.ab.map(a=>`<b>${AB[a].i} ${AB[a].n}:</b> ${AB[a].d}`).join('<br>');
}
function cardHTML(id,o={}){
  const c=CARD[id],isU=c.t==='u';
  const top=isU?`<div class="cp ${c.ab.includes('held')?'hero':''}">${c.p}</div><div class="crow" title="${ROWS[c.row].n}">${ROWS[c.row].i}</div>`:`<div class="cp spec">★</div>`;
  return `<div class="card r${c.r}">
    ${top}
    <div class="cart">${cardArt(id)}</div>
    <div class="cname">${esc(c.n)}</div>
    <div class="ctype">${RAR[c.r].n} · ${isU?ROWS[c.row].n:'Spezialkarte'}</div>
    <div class="cab">${abilityText(c)}</div>
    ${c.fl?`<div class="cfl">${esc(c.fl)}</div>`:''}
    ${o.count?`<div class="ccount">×${o.count}</div>`:''}
    ${o.isNew?'<div class="cnew">NEU!</div>':''}
  </div>`;
}

}

    <li><b>Neue Karten</b> bekommst du in der Kartenschmiede: Jede richtig gelöste Physik-Aufgabe beschwört eine zufällige Karte. Schwere Aufgaben bringen öfter seltene Karten.</li>

const E0=8.854e-12;

let curTask=null,taskLvl=1,lastGen='';
function newTask(){
  const list=GEN[taskLvl];let i,key,tries=0;
  do{i=Math.floor(Math.random()*list.length);key=taskLvl+'-'+i;}while(key===lastGen&&++tries<10);
  lastGen=key;curTask=Object.assign(list[i](),{lvl:taskLvl,result:null,showHint:false});
}
function parseNum(s){
  s=String(s).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/[·⋅×xX]/g,'*');
  const m=s.match(/^([-+]?\d*\.?\d+)(?:(?:\*10\^?|e)([-+]?\d+))?$/i);
  if(!m) return NaN;
  return parseFloat(m[1])*Math.pow(10,m[2]?parseInt(m[2],10):0);
}
function checkAnswer(){
  if(!curTask||curTask.result) return;
  const raw=$('#ans').value, v=parseNum(raw);
  if(isNaN(v)){toast('Bitte gib eine Zahl ein (z. B. 12,5).');return;}
  const ok=Math.abs(v-curTask.ans)<=Math.abs(curTask.ans)*0.02;
  S.s.all++;
  let drawn=[],flags=[],bonus=false;
  if(ok){
    S.s.ok++;S.s.st++;S.s.best=Math.max(S.s.best,S.s.st);
    const n=1+(S.s.st%5===0?1:0); bonus=n>1;
    for(let i=0;i<n;i++){const id=drawCard(LVL[curTask.lvl].odds);flags.push(!S.c[id]);addCard(id);drawn.push(id);}
  }else S.s.st=0;
  curTask.result={ok,given:raw,bonus};
  persist();renderHub();
  if(ok) revealCards(drawn,flags,bonus?'🔥 Doppelte Beschwörung!':'✨ Richtig gelöst!',bonus?'5 richtige Antworten in Folge – du erhältst eine Bonuskarte!':'Die Kristalle leuchten auf … eine neue Karte erscheint!');
}

function startNew(name){
  S={n:name,c:{},d:{},b:[],s:{ok:0,all:0,st:0,best:0,w:0,l:0}};

let G=null,uidC=0;
const inst=id=>({u:++uidC,id});
const other=s=>s==='pl'?'ai':'pl';
const has=(c,a)=>CARD[c.id].ab.includes(a);
function drawN(g,side,n){let k=0;while(k<n&&g.deck[side].length){g.hand[side].push(g.deck[side].shift());k++;}return k;}
function rowPowers(g,side,r){
  const cards=g.rows[side][r];
  const morals=cards.filter(c=>has(c,'moral')).length;
  return cards.map(c=>{
    const d=CARD[c.id];
    if(d.ab.includes('held'))return d.p;
    let p=g.weather[r]?1:d.p;
    if(d.ab.includes('bund'))p*=cards.filter(x=>x.id===c.id).length;
    p+=morals-(d.ab.includes('moral')?1:0);
    if(side==='ai'&&g.boss.pass==='moral')p+=1;
    if(g.horn[side][r])p*=2;
    return p;
  });
}
const rowSum=(g,s,r)=>rowPowers(g,s,r).reduce((a,b)=>a+b,0);
const total=(g,s)=>RK.reduce((a,r)=>a+rowSum(g,s,r),0);
function scorch(g,sides){
  let max=0;const list=[];
  for(const s of sides)for(const r of RK){const pw=rowPowers(g,s,r);g.rows[s][r].forEach((c,i)=>{if(has(c,'held'))return;list.push({s,r,c,p:pw[i]});if(pw[i]>max)max=pw[i];});}
  if(!list.length||max<=0)return 'Kein Ziel getroffen.';
  const kill=list.filter(x=>x.p===max);
  for(const k of kill){const a=g.rows[k.s][k.r];a.splice(a.indexOf(k.c),1);g.discard[k.s].push(k.c);}
  return kill.map(k=>CARD[k.c.id].n).join(', ')+' vernichtet!';
}
function applyCard(g,side,card,row){
  const d=CARD[card.id],opp=other(side);
  if(d.t==='w'){
    if(d.w==='klar')g.weather={N:false,F:false,B:false};else g.weather[d.w]=true;
    g.discard[side].push(card);
    return d.w==='klar'?'☀️ Klarer Himmel – das Wetter klart auf.':`${d.e} ${d.n} legt sich über die ${ROWS[d.w].n}reihe.`;
  }
  if(d.t==='horn'){g.horn[side][row]=card;return `📯 Kriegshorn in der ${ROWS[row].n}reihe!`;}
  if(d.t==='blitz'){const k=scorch(g,['pl','ai']);g.discard[side].push(card);return '🌩️ Göttlicher Blitz! '+k;}
  let msg;
  if(d.ab.includes('spion')){g.rows[opp][d.row].push(card);const n=drawN(g,side,2);msg=`${d.e} ${d.n} schleicht sich zum Gegner (+${n} Karte${n===1?'':'n'}).`;}
  else{g.rows[side][d.row].push(card);msg=`${d.e} ${d.n} betritt die ${ROWS[d.row].n}reihe.`;}
  if(d.ab.includes('heiler')){
    const cand=g.discard[side].filter(c=>{const x=CARD[c.id];return x.t==='u'&&!x.ab.includes('held')&&!x.ab.includes('spion');});
    if(cand.length){cand.sort((a,b)=>CARD[b.id].p-CARD[a.id].p);const pc=cand[0];g.discard[side].splice(g.discard[side].indexOf(pc),1);msg+=` ✚ ${CARD[pc.id].n} kehrt zurück!`;applyCard(g,side,pc);}
  }
  if(d.ab.includes('brand'))msg+=' 🔥 '+scorch(g,[opp]);
  return msg;
}

const HANDMAX=10;

function bossHandSize(b){return b.hand+(b.pass==='spione'?2:0)+(b.pass==='zug'?1:0);}
function handValue(id,sel){ // grobe Stärke einer Karte für „Beste Auswahl“
  const c=CARD[id];
  if(c.t==='u'){let v=c.p;
    if(c.ab.includes('spion'))v=7;
    if(c.ab.includes('heiler'))v+=4;
    if(c.ab.includes('moral'))v+=2;
    if(c.ab.includes('brand'))v+=4;
    if(c.ab.includes('bund'))v+=c.p*(sel[id]||0);
    return v;}
  if(c.t==='horn')return 7; if(c.t==='blitz')return 6; return 1;
}

function startBattle(){
  const bi=prep.bi,boss=BOSSES[bi],sel=prep.sel;
  const hand=[];for(const id in sel)for(let i=0;i<sel[id];i++)hand.push(inst(id));

  const ai=aiPickHand(boss);
  G={bi,boss,round:1,lives:{pl:2,ai:2},
    rows:{pl:{N:[],F:[],B:[]},ai:{N:[],F:[],B:[]}},horn:{pl:{N:null,F:null,B:null},ai:{N:null,F:null,B:null}},
    weather:{N:false,F:false,B:false},deck:{pl:shuffle(rest),ai:ai.rest},hand:{pl:hand,ai:ai.hand},discard:{pl:[],ai:[]},
    passed:{pl:false,ai:false},played:{pl:0,ai:0},plPow:[],turn:'pl',log:[],sel:null,hornMode:null,busy:false,banner:null};

/* Boss wählt seine Starthand: Bewertung jeder Karte im Kontext seines Decks */
function aiPickHand(boss){
  const n=bossHandSize(boss),all=boss.deck.map(inst);
  if(all.length<=n)return{hand:all,rest:[]};
  const rows={N:0,F:0,B:0};
  all.forEach(c=>{const d=CARD[c.id];if(d.t==='u'&&!d.ab.includes('held'))rows[d.row]++;});
  const score=c=>{
    const d=CARD[c.id];
    if(c===all[0])return 999;                                   // Bosskarte immer
    if(d.t==='u'){let v=d.p;
      if(d.ab.includes('held'))v+=3;
      if(d.ab.includes('spion'))v=8;                            // Kartenvorteil
      if(d.ab.includes('heiler'))v+=3;
      if(d.ab.includes('brand'))v+=4;
      if(d.ab.includes('moral'))v+=2*Math.max(0,rows[d.row]-1);
      if(d.ab.includes('bund'))v+=d.p*(all.filter(x=>x.id===c.id).length-1);
      return v;}
    if(d.t==='horn')return 9;
    if(d.t==='blitz')return 7;
    if(d.t==='w')return d.w==='klar'?3:(rows[d.w]<=1?6:0);      // Wetter nur, wenn es den Boss kaum trifft
    return 0;
  };
  const sorted=all.slice().sort((a,b)=>score(b)-score(a));
  return{hand:sorted.slice(0,n),rest:shuffle(sorted.slice(n))};
}
function startRound(){

  const p=g.boss.pass;

  if(p==='frost'){g.weather.N=true;addLog('❄️ Frostbarts ewiger Winter friert die Nahkampfreihe ein.');}
  if(!g.hand.pl.length){g.passed.pl=true;addLog('Du hast keine Handkarten mehr und passt.');}
  if(!g.hand.ai.length)g.passed.ai=true;
  showBanner(`Runde ${g.round}`);
  if(g.passed.pl&&g.passed.ai){g.busy=true;later(endRound,1200);return;}
  if(g.passed.pl){g.turn='ai';g.busy=true;renderBattle();later(aiTurn,1100);}
  else{g.turn='pl';renderBattle();}
}
function later(fn,ms){const g=G;setTimeout(()=>{if(G===g)fn();},ms);}
function showBanner(t,ms=1300){const g=G;g.banner=t;renderBattle();setTimeout(()=>{if(G===g&&g.banner===t){g.banner=null;renderBattle();}},ms);}
function advance(from){

function plPlay(u,row){
  const g=G;if(g.turn!=='pl'||g.passed.pl||g.busy)return;
  const i=g.hand.pl.findIndex(c=>c.u===u);if(i<0)return;

  addLog('Du: '+applyCard(g,'pl',card,row));
  g.sel=null;g.hornMode=null;
  if(!g.hand.pl.length){g.passed.pl=true;addLog('Keine Handkarten mehr – du passt automatisch.');}
  advance('pl');

function plPass(){const g=G;if(g.turn!=='pl'||g.passed.pl||g.busy)return;g.passed.pl=true;g.sel=null;g.hornMode=null;addLog('Du passt.');advance('pl');}
/* =========================================================
   TAKTISCHE BOSS-KI
   Jede mögliche Karte wird auf einer Kopie des Spielfelds simuliert
   (gain = wie stark sich der Punktabstand verbessert). Danach wird
   entschieden, ob sich das Ausspielen lohnt oder Passen klüger ist.
   ========================================================= */
function aiDecide(){
  const g=G,hand=g.hand.ai;
  const PASS=why=>({pass:true,why});
  if(!hand.length)return PASS('hat keine Karten mehr');
  const diff=total(g,'ai')-total(g,'pl');           // >0: Boss führt
  const myN=hand.length,plN=g.hand.pl.length;        // Handkarten beider Seiten
  const aiMust=g.lives.ai===1;                       // verliert der Boss diese Runde, ist das Duell verloren
  // Wie stark sind die Karten des Spielers im Schnitt? (aus seinen bisher gespielten Karten geschätzt)
  const est=g.plPow.length?Math.min(12,Math.max(3,g.plPow.reduce((a,b)=>a+b,0)/g.plPow.length)):6;
  // 1) Alle Optionen simulieren
  const opts=[];
  for(const c of hand){
    const d=CARD[c.id];
    const rows=d.t==='horn'?RK.filter(r=>!g.horn.ai[r]):[null];
    for(const r of rows){
      const g2=JSON.parse(JSON.stringify(g));
      const cc=g2.hand.ai.splice(g2.hand.ai.findIndex(x=>x.u===c.u),1)[0];
      applyCard(g2,'ai',cc,r);
      const nd=total(g2,'ai')-total(g2,'pl');
      let gain=nd-diff;
      if(d.ab.includes('spion'))gain+=Math.min(2,g.deck.ai.length)*4;   // Kartenvorteil durch Spion
      opts.push({c,r,gain,nd,cost:d.ab.includes('held')?d.p+6:(d.p||6)});
    }
  }
  opts.sort((a,b)=>b.gain-a.gain);
  const best=opts[0];
  // Summe der besten Zugewinne mit höchstens n verschiedenen Karten
  const reach=n=>{const used=new Set();let sum=0,k=0;for(const o of opts){if(k>=n)break;if(used.has(o.c.u)||o.gain<=0)continue;used.add(o.c.u);sum+=o.gain;k++;}return sum;};
  const cardsNeeded=()=>{for(let n=1;n<=myN;n++)if(diff+reach(n)>0)return n;return Infinity;};

  // 2) Der Spieler hat bereits gepasst
  if(g.passed.pl){
    if(diff>0)return PASS('führt bereits – die Runde ist sicher');
    const win=opts.filter(o=>o.nd>0).sort((a,b)=>a.cost-b.cost||a.gain-b.gain);
    if(win.length)return win[0];                    // billigste Karte, die die Runde gewinnt
    const need=cardsNeeded();
    if(need===Infinity)return PASS('liegt uneinholbar zurück und spart sich die Karten');
    if(aiMust)return best;                          // letzte Chance: alles geben
    // lohnt sich, wenn der Boss höchstens so viele Karten braucht, wie der Spieler investiert hat,
    // oder wenn er danach immer noch mindestens gleich viele Karten wie der Spieler hat
    if(need<=Math.max(1,g.played.pl)||myN-need>=plN)return best;
    return PASS('gibt die Runde auf – das Aufholen würde zu viele Karten kosten');
  }

  // 3) Der Spieler spielt noch
  if(best.gain<=0)return PASS('hat keine Karte, die sich gerade lohnt');
  if(diff<0&&diff+reach(myN)<=0)return PASS('liegt uneinholbar zurück und spart sich die Karten');
  if(!aiMust){
    // a) Rückstand zu groß: mehr als 2 Karten nötig → Runde abschenken, Karten sparen
    //    (nur wenn der Boss dafür deutlich mehr Karten bräuchte, als der Spieler eingesetzt hat)
    if(diff<0){const need=cardsNeeded();if(need>2&&need>g.played.pl+1)return PASS('gibt die Runde auf – der Rückstand ist zu groß, die Karten werden für später gespart');}
    // b) Führung + Kartenvorteil: Spieler musste mehr Karten investieren → passen
    if(diff>0&&g.played.pl>g.played.ai&&myN>=plN)return PASS('führt und passt – du musst jetzt weitere Karten opfern, um aufzuholen');
    if(diff>0&&diff>=est&&g.played.ai>=1&&myN>=plN)return PASS('führt deutlich und hebt sich den Rest für die nächste Runde auf');
    // c) Strategischer Rückzug mit wenigen Karten
    if(myN<=2&&diff<=0&&plN>myN)return PASS('zieht sich zurück und hebt die letzten Karten für die Entscheidung auf');
  }else{
    // Entscheidungsrunde: nur passen, wenn der Vorsprung praktisch nicht mehr einzuholen ist
    if(diff>0&&diff>est*plN)return PASS('führt uneinholbar');
  }
  return best;
}
function aiTurn(){
  const g=G;if(!g||g.passed.ai){advance('ai');return;}
  const o=aiDecide();
  if(o.pass){g.passed.ai=true;addLog(`${g.boss.k} passt: ${o.why}.`);}
  else{
    g.hand.ai.splice(g.hand.ai.findIndex(x=>x.u===o.c.u),1);g.played.ai++;
    addLog(`${g.boss.k}: `+applyCard(g,'ai',o.c,o.r));
    if(!g.hand.ai.length){g.passed.ai=true;addLog(`${g.boss.k} hat keine Karten mehr.`);}
  }
  g.busy=false;advance('ai');
}
function endRound(){
  const g=G,a=total(g,'pl'),b=total(g,'ai');
  let t;
  if(a>b){g.lives.ai--;t=`🏅 Runde ${g.round} gewonnen! (${a} : ${b})`;}
  else if(b>a){g.lives.pl--;t=`💀 Runde ${g.round} verloren (${a} : ${b})`;}
  else{g.lives.pl--;g.lives.ai--;t=`⚖️ Unentschieden (${a} : ${b}) – beide verlieren ein Leben`;}
  addLog(t);showBanner(t,1900);
  later(()=>{
    for(const s of ['pl','ai'])for(const r of RK){g.discard[s].push(...g.rows[s][r]);g.rows[s][r]=[];if(g.horn[s][r]){g.discard[s].push(g.horn[s][r]);g.horn[s][r]=null;}}
    g.weather={N:false,F:false,B:false};
    if(g.lives.pl<=0||g.lives.ai<=0){endMatch();return;}
    g.round++;startRound();
  },2000);
}
function endMatch(){
  const g=G,win=g.lives.ai<=0&&g.lives.pl>0,first=win&&!S.b.includes(g.bi);
  G=null;view='bosses';
  if(win){
    S.s.w=(S.s.w||0)+1;
    if(first){
      S.b.push(g.bi);const id=drawCard({[g.boss.rew]:100});const isNew=!S.c[id];addCard(id);persist();renderHub();
      const last=g.bi===BOSSES.length-1;
      revealCards([id],[isNew],'🏆 Sieg!',last?`Du hast Lord Ampérion besiegt und Voltaria die Ladung zurückgegeben! Du bist ein wahrer Meister des Kondensators.`:`${esc(g.boss.n)} ist besiegt! ${esc(BOSSES[g.bi+1].n)} wartet bereits … Als Belohnung erhältst du eine ${RAR[g.boss.rew].n}e Karte.`);
    }else{persist();renderHub();modal(`<h2>🏆 Sieg!</h2><p>Du hast ${esc(g.boss.n)} erneut besiegt. Belohnungskarten gibt es nur beim ersten Sieg – aber dein Ruhm wächst!</p><button class="btn gold" data-act="closeModal">Weiter</button>`);}
  }else{
    S.s.l=(S.s.l||0)+1;persist();renderHub();
    const str=deckStrength();
    modal(`<h2>${g.lives.ai<=0?'⚖️ Unentschieden':'💀 Niederlage'}</h2><p>${esc(g.boss.n)} war diesmal zu stark.</p>
      <p>Stärke deiner besten 10 Karten: <b>${str}</b> · empfohlen: <b>${g.boss.rec}</b></p>
      <p class="muted">${str<g.boss.rec?'Löse weitere Aufgaben in der Kartenschmiede, um stärkere Karten zu beschwören. Schwere Aufgaben bringen öfter epische und legendäre Karten!':'Deine Karten sind stark genug – probiere eine andere Taktik! Spare starke Karten für die entscheidenden Runden und passe auch mal früh.'}</p>
      <div class="row2"><button class="btn gold" data-act="goTasks">📜 Zur Kartenschmiede</button><button class="btn" data-act="closeModal">Zu den Bossen</button></div>`);
  }
}
function findCard(g,u){
  let c=g.hand.pl.find(x=>x.u===u);if(c)return{c,where:'hand'};
  for(const s of ['pl','ai'])for(const r of RK){c=g.rows[s][r].find(x=>x.u===u);if(c)return{c,where:'board',p:rowPowers(g,s,r)[g.rows[s][r].indexOf(c)]};}
  return null;
}
function mini(g,c,p,where){
  const d=CARD[c.id];let cls='';
  if(d.t==='u'&&p!=null&&!d.ab.includes('held')){if(p>d.p)cls='up';else if(p<d.p)cls='down';}
  const icons=d.t==='u'?d.ab.filter(a=>a!=='held').map(a=>AB[a].i).join(''):'';
  return `<div class="mini r${d.r} ${g.sel===c.u?'sel':''}" data-act="${where==='hand'?'hcard':'bcard'}" data-u="${c.u}" title="${esc(d.n)}">
    <span class="mp ${d.ab.includes('held')?'hero':''} ${cls}">${d.t==='u'?(p??d.p):'★'}</span>
    ${cardArt(c.id)}${icons?`<span class="mab">${icons}</span>`:''}
    ${where==='hand'&&d.t==='u'?`<span class="mrow">${ROWS[d.row].i}</span>`:''}</div>`;
}
function renderBattle(){
  const g=G;if(!g)return;
  const tp=total(g,'pl'),ta=total(g,'ai');
  const gems=n=>'◆'.repeat(Math.max(0,n))+'<span style="opacity:.25">'+'◆'.repeat(Math.max(0,2-n))+'</span>';
  const row=(s,r)=>{
    const pw=rowPowers(g,s,r),sum=pw.reduce((a,b)=>a+b,0),tgt=s==='pl'&&g.hornMode&&!g.horn.pl[r];
    return `<div class="brow ${s} ${g.weather[r]?'w'+r:''} ${tgt?'target':''}" ${tgt?`data-act="hornrow" data-row="${r}"`:''}>
      <div class="rsum">${sum}</div><div class="rhorn">${g.horn[s][r]?'📯':''}</div>
      <div class="rcards">${g.rows[s][r].map((c,i)=>mini(g,c,pw[i],'board')).join('')}</div>
      <div class="rico" title="${ROWS[r].n}">${ROWS[r].i}${g.weather[r]?`<span class="wico">${WICO[r]}</span>`:''}</div></div>`;
  };
  const sel=g.sel!=null?findCard(g,g.sel):null;
  const myTurn=g.turn==='pl'&&!g.passed.pl&&!g.busy;
  let info;
  if(g.hornMode)info=`<div class="ibar"><span class="ibig">📯</span><div class="itxt"><b>Kriegshorn:</b> Tippe auf eine deiner Reihen (gelb umrandet), um sie zu verdoppeln.</div><button class="btn small ghost" data-act="cancelHorn">Abbrechen</button></div>`;
  else if(sel){const d=CARD[sel.c.id];
    info=`<div class="ibar"><span class="ibig">${cardArt(sel.c.id)}</span><div class="itxt"><b>${esc(d.n)}</b> <span class="rtag r${d.r}">${RAR[d.r].n}</span> ${d.t==='u'?`<span class="muted small">· ${ROWS[d.row].n} · Grundstärke ${d.p}${sel.p!=null?` · aktuell ${sel.p}`:''}</span>`:''}<div class="small">${abilityText(d)}</div></div>${sel.where==='hand'&&myTurn?`<button class="btn gold" data-act="play" data-u="${sel.c.u}">Ausspielen</button>`:''}</div>`;}
  else{
    const t=g.passed.pl?'Du hast gepasst – warte auf das Rundenende.':g.turn==='ai'?`⏳ ${esc(g.boss.n)} überlegt …`:'👉 Du bist am Zug: Tippe eine Handkarte an oder passe.';
    info=`<div class="ibar"><div class="itxt">${t}</div></div>`;
  }
  app.innerHTML=`<div class="battle">
    <div class="bbar"><button class="btn small ghost" data-act="giveup">🏳️ Aufgeben</button><span class="muted small">Duell gegen ${esc(g.boss.n)}</span><button class="btn small ghost" data-act="rules">📖 Regeln</button></div>
    <div class="pinfo ai"><div class="pport">${cardArt(g.boss.deck[0])}</div><div><div class="pname">${esc(g.boss.n)}</div><div class="gems" style="color:#ff8a7a">${gems(g.lives.ai)}</div></div>
      <div class="pstats">🂠 ${g.hand.ai.length} Handkarten<br>${g.passed.ai?'<span class="passtag">Gepasst</span>':''}</div><div class="ptotal ${ta>tp?'lead':''}">${ta}</div></div>
    <div class="board">
      ${row('ai','B')}${row('ai','F')}${row('ai','N')}
      <div class="mid"><span>Runde <b>${g.round}</b></span>${RK.filter(r=>g.weather[r]).map(r=>`<span>${WICO[r]} ${ROWS[r].n}</span>`).join('')}</div>
      ${row('pl','N')}${row('pl','F')}${row('pl','B')}
    </div>
    <div class="pinfo pl"><div class="pport">🧝</div><div><div class="pname">${esc(S.n)}</div><div class="gems" style="color:var(--gold2)">${gems(g.lives.pl)}</div></div>
      <div class="pstats">🂠 ${g.hand.pl.length} Handkarten<br>${g.passed.pl?'<span class="passtag">Gepasst</span>':''}</div>
      <button class="btn ${myTurn?'danger':''}" data-act="pass" ${myTurn?'':'disabled'}>Passen</button>
      <div class="ptotal ${tp>ta?'lead':''}">${tp}</div></div>
    ${info}
    <div class="hand">${g.hand.pl.slice().sort((a,b)=>{const x=CARD[a.id],y=CARD[b.id];return (RK.indexOf(x.row)-RK.indexOf(y.row))||((x.p||0)-(y.p||0));}).map(c=>mini(g,c,null,'hand')).join('')||'<span class="muted">Keine Handkarten mehr</span>'}</div>
    <div class="blog">${g.log.slice(0,4).map(l=>`<div>${esc(l)}</div>`).join('')}</div>
    ${g.banner?`<div class="banner">${esc(g.banner)}</div>`:''}
  </div>`;
}

/* =========================================================
   EREIGNISSE
   ========================================================= */
document.addEventListener('click',e=>{
  let el=e.target.closest('[data-act]');
  if(G&&G.hornMode){const hr=e.target.closest('[data-act=hornrow]');if(hr)el=hr;}
  if(!el)return;
  const a=el.dataset.act,ds=el.dataset;
  switch(a){
    case 'closeModal':closeModal();break;
    case 'continue':try{login(readCode(localStorage.getItem('kc_save')));}catch(err){toast(err.message);}break;
    case 'view':view=ds.v;renderHub();break;
    case 'rules':showRules();break;
    case 'save':showSave();break;
    case 'copy':{const code=$('#codebox').dataset.code;const ok=()=>{$('#copymsg').textContent='✔ Kopiert! Füge den Code jetzt an einem sicheren Ort ein.';};
      const fail=()=>{const t=$('#codebox');t.focus();t.select();$('#copymsg').textContent='Der Code ist markiert – kopiere ihn mit Strg+C (bzw. ⌘+C).';};
      try{navigator.clipboard.writeText(code).then(ok,fail);}catch(err){fail();}break;}
    case 'logout':
      if(dirty)modal(`<h2>Abmelden?</h2><p>Du hast deinen aktuellen Speichercode noch nicht angezeigt. Ohne Code kannst du auf einem anderen Gerät nicht weiterspielen.</p><div class="row2"><button class="btn gold" data-act="save">💾 Code anzeigen</button><button class="btn ghost" data-act="doLogout">Trotzdem abmelden</button></div>`);
      else{S=null;renderStart();}break;
    case 'doLogout':closeModal();S=null;G=null;renderStart();break;
    case 'lvl':taskLvl=+ds.l;if(!curTask||curTask.result||curTask.lvl!==taskLvl)newTask();renderTasks();break;
    case 'hint':curTask.showHint=true;renderTasks();break;
    case 'next':newTask();renderTasks();break;
    case 'filter':colFilter=ds.f;renderCards();break;
    case 'fight':openPrep(+ds.b);break;
    case 'prepAdd':{const id=ds.id,st=prepStats();if(st.n>=HANDMAX){toast(`Deine Starthand ist voll (max. ${HANDMAX} Karten).`);break;}if((prep.sel[id]||0)>=S.c[id])break;prep.sel[id]=(prep.sel[id]||0)+1;renderPrep();break;}
    case 'prepRem':{const id=ds.id;if(prep.sel[id]){prep.sel[id]--;if(!prep.sel[id])delete prep.sel[id];}renderPrep();break;}
    case 'prepAuto':prep.sel=autoPick();renderPrep();break;
    case 'prepClear':prep.sel={};renderPrep();break;
    case 'prepFilter':prep.filter=ds.f;renderPrep();break;
    case 'prepBack':prep=null;view='bosses';renderHub();break;
    case 'prepStart':startBattle();break;
    case 'goTasks':closeModal();view='tasks';renderHub();break;
    // Kampf
    case 'hcard':{const u=+ds.u;if(G.hornMode&&G.hornMode!==u)G.hornMode=null;
      if(G.sel===u&&G.turn==='pl'&&!G.passed.pl&&!G.busy)plPlay(u);else{G.sel=u;renderBattle();}break;}
    case 'bcard':G.sel=+ds.u;G.hornMode=null;renderBattle();break;
    case 'play':plPlay(+ds.u);break;
    case 'hornrow':plPlay(G.hornMode,ds.row);break;
    case 'cancelHorn':G.hornMode=null;G.sel=null;renderBattle();break;
    case 'pass':plPass();break;
    case 'giveup':modal(`<h2>Aufgeben?</h2><p>Das Duell zählt dann als Niederlage. Deine Karten behältst du natürlich.</p><div class="row2"><button class="btn danger" data-act="doGiveup">🏳️ Aufgeben</button><button class="btn ghost" data-act="closeModal">Weiterkämpfen</button></div>`);break;
    case 'doGiveup':closeModal();if(G){G=null;S.s.l=(S.s.l||0)+1;persist();}view='bosses';renderHub();break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='aform')checkAnswer();
  else if(f.id==='newform'){const n=$('#pname').value.trim();if(!n){$('#newerr').textContent='Bitte gib einen Namen ein.';return;}startNew(n);}
  else if(f.id==='loadform'){try{login(readCode($('#pcode').value));}catch(err){$('#loaderr').textContent=err.message||'Der Code konnte nicht gelesen werden.';}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&S&&view==='tasks'&&curTask&&curTask.result&&$('#modal').classList.contains('hidden')&&document.activeElement.tagName!=='BUTTON'){newTask();renderTasks();}
  if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')&&!$('.reveal'))closeModal();
});
document.addEventListener('focusin',e=>{if(e.target.id==='codebox')e.target.select();});

renderStart();
</script>
